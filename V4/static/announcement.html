<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>公告 - WebChat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #f0f0f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal {
      background: white;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      padding: 24px;
      position: relative;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      max-height: 80vh;
      overflow-y: auto;
    }
    .close-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 24px;
      cursor: pointer;
      width: 32px;
      height: 32px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      color: #999;
      transition: background 0.2s, color 0.2s;
    }
    .close-btn:hover {
      background: #f0f0f0;
      color: #333;
    }
    .modal h2 {
      text-align: center;
      margin-bottom: 16px;
      color: #333;
    }
    .modal-content {
      line-height: 1.6;
      color: #555;
      font-size: 15px;
    }
    .modal-content p {
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <!-- 可以放一个 loading 或背景，但这里直接显示模态框 -->
  <div class="modal-overlay">
    <div class="modal">
      <div class="close-btn" onclick="closeAnnouncement()">❌</div>
      <h2>系统公告</h2>
      <div class="modal-content">
        <p>欢迎使用 WebChat！请仔细阅读以下注意事项：</p>
        <p>1. 进入系统后会自动加超级管理员账号，目前官方只有“超级管理员”一人。</p>
        <p>2. 聊天记录将加密存储，但请勿泄露个人敏感信息。</p>
        <p>3. 请勿发送违法、违规或骚扰信息。</p>
        <p>4. 如遇问题，请联系管理员，如不小心删除请加：352289728@qq.com</p>
        <p>感谢您的理解与支持！</p>
      </div>
    </div>
  </div>

  <script>
    function closeAnnouncement() {
      // 关闭后跳转到主界面
      window.location.href = '/chat/contacts';
    }

    // 防止用户按返回键回到登录页（可选）
    history.replaceState(null, null, window.location.href);
  </script>
</body>
</html>
