<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>聊天 - WebChat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body {
      background: #e5ddd5;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding-bottom: 50px; /* ✅ 保持不变 */
    }
    #header {
      padding: 10px;
      background: #07c160;
      color: white;
      text-align: center;
    }
    #messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      padding-bottom: 80px; /* ✅ 保持不变 */
    }
    .message {
      max-width: 70%;
      padding: 8px 12px;
      margin: 6px 0;
      border-radius: 8px;
      word-wrap: break-word;
    }
    .sent {
      background: #dcf8c6;
      margin-left: auto;
      text-align: right;
    }
    .received {
      background: white;
    }
    .message img, .message video {
      max-width: 200px;
      max-height: 300px;
      border-radius: 8px;
    }
    .time-label {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
      text-align: right;
      white-space: nowrap;
    }
    .sent .time-label {
      text-align: right;
    }
    .received .time-label {
      text-align: left;
    }
    #input-area {
      display: flex;
      padding: 10px;
      background: white;
      border-top: 1px solid #ddd;
      position: fixed;
      bottom: 40px; /* ✅ 修改为 40px，紧贴 nav 上方 */
      left: 0;
      right: 0;
      z-index: 10;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    #message-input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 20px;
    }
    #send-btn {
      padding: 10px 20px;
      margin-left: 10px;
      background: #07c160;
      color: white;
      border: none;
      border-radius: 20px;
    }
    #upload-btn {
      background: #ccc;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 8px;
      cursor: pointer;
      font-size: 18px;
    }
    #file-input {
      display: none;
    }
    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      background: white;
      padding: 10px; /* ✅ 与其他页面一致 */
      /* height: 60px; 删除 */
      /* box-shadow: ...; 删除 */
      /* border-top: ...; 删除 */
    }
    .nav a {
      text-decoration: none;
      color: #333;
    }
  </style>
</head>
<body>
  <div id="header">与 <span id="friend-name">—</span> 聊天</div>
  <div id="messages"></div>

  <div id="input-area">
    <input id="message-input" placeholder="输入消息..." />
    <label for="file-input" id="upload-btn">📎</label>
    <input type="file" id="file-input" accept="image/*,video/*" />
    <button id="send-btn" onclick="sendMessage()">发送</button>
  </div>

  <div class="nav">
    <a href="/chat/chat_list">聊天</a>
    <a href="/chat/contacts">联系人</a>
    <a href="/chat/discover">发现</a>
  </div>

  <script>
    const currentUser = localStorage.getItem('currentUser');
    if (!currentUser) location.href = '/chat/login';

    const urlParams = new URLSearchParams(window.location.search);
    const friend = urlParams.get('with');
    if (!friend) location.href = '/chat/contacts';

    document.getElementById('friend-name').textContent = decodeURIComponent(friend);

    async function getJson(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    }

    async function postJson(url, data) {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    }

    function formatTime(timestamp) {
      let date;
      if (typeof timestamp === 'string') {
        const parsedDate = new Date(timestamp);
        if (isNaN(parsedDate.getTime())) return '未知时间';
        date = parsedDate;
      } else if (typeof timestamp === 'number') {
        const isMilliseconds = timestamp > 10000000000;
        const seconds = isMilliseconds ? timestamp / 1000 : timestamp;
        date = new Date(seconds * 1000);
        if (isNaN(date.getTime())) return '未知时间';
      } else {
        return '未知时间';
      }
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${year}-${month}-${day} ${hours}:${minutes}`;
    }

    function renderMessage(msg) {
      const isSent = msg.from === currentUser;
      const div = document.createElement('div');
      div.className = 'message ' + (isSent ? 'sent' : 'received');

      let content = null;
      const text = msg.text;

      if (typeof text === 'object' && text !== null && text.type === 'file') {
        const url = text.url;
        if (url.startsWith('data:image/')) {
          const img = document.createElement('img');
          img.src = url;
          content = img;
        } else if (url.startsWith('data:video/')) {
          const video = document.createElement('video');
          video.src = url;
          video.controls = true;
          content = video;
        } else if (url.startsWith('/chat/uploads/')) {
          if (text.mimetype?.startsWith('image/')) {
            const img = document.createElement('img');
            img.src = url;
            content = img;
          } else if (text.mimetype?.startsWith('video/')) {
            const video = document.createElement('video');
            video.src = url;
            video.controls = true;
            content = video;
          } else {
            content = document.createTextNode('[文件]');
          }
        }
      } else {
        content = document.createTextNode(text || '[未知消息]');
      }

      div.appendChild(content);

      const timeLabel = document.createElement('div');
      timeLabel.className = 'time-label';
      timeLabel.textContent = formatTime(msg.time);
      div.appendChild(timeLabel);

      return div;
    }

    let lastMessageCount = 0;

    async function loadMessages() {
      try {
        const msgs = await getJson(`/chat/api/messages/${currentUser}/${friend}`);
        const container = document.getElementById('messages');

        // 判断用户是否在底部（允许 2px 误差）
        const isAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 2;

        // 保存滚动位置（如果不在底部）
        const oldScrollTop = container.scrollTop;
        const oldScrollHeight = container.scrollHeight;

        // 渲染新消息
        container.innerHTML = '';
        msgs.forEach(msg => {
          container.appendChild(renderMessage(msg));
        });

        // 智能滚动：只有当之前在底部，或者这是首次加载，才滚动到底部
        if (isAtBottom || lastMessageCount === 0) {
          container.scrollTop = container.scrollHeight;
        } else {
          // 否则恢复之前的滚动位置（考虑新增消息高度）
          const newScrollHeight = container.scrollHeight;
          container.scrollTop = newScrollHeight - oldScrollHeight + oldScrollTop;
        }

        lastMessageCount = msgs.length;
      } catch (err) {
        console.error('加载消息失败:', err);
      }
    }

    async function markMessagesAsRead() {
      try {
        const msgs = await getJson(`/chat/api/messages/${currentUser}/${friend}`);
        const unreadMsgs = msgs.filter(m => m.from !== currentUser && !m.read);
        if (unreadMsgs.length > 0) {
          const ids = unreadMsgs.map(m => m.id);
          await fetch(`/chat/api/mark_read`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user: currentUser, friend: friend, message_ids: ids })
          });
        }
      } catch (err) {
        console.warn('标记已读失败:', err);
      }
    }

    async function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;

      try {
        await postJson('/chat/api/send_message', { from: currentUser, to: friend, text });
        input.value = '';
        loadMessages(); // 发送后立即刷新
      } catch (err) {
        alert('发送失败');
      }
    }

    document.getElementById('file-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const maxSize = 20 * 1024 * 1024;
      if (file.size > maxSize) {
        alert('文件不能超过 20MB');
        return;
      }

      const allowedTypes = ['image/jpeg', 'image/png', 'image/gif', 'video/mp4', 'video/quicktime'];
      if (!allowedTypes.includes(file.type)) {
        alert('仅支持 JPG/PNG/GIF/MP4/MOV');
        return;
      }

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch('/chat/api/send_file', {
          method: 'POST',
          body: formData
        });
        if (!res.ok) throw new Error('上传失败');

        const result = await res.json();
        await postJson('/chat/api/send_message', {
          from: currentUser,
          to: friend,
          text: {
            type: 'file',
            url: result.url,
            mimetype: file.type
          }
        });
        loadMessages();
      } catch (err) {
        alert('文件发送失败: ' + (err.message || '未知错误'));
      }

      e.target.value = '';
    });

    document.getElementById('message-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // 初始加载
    loadMessages();
    markMessagesAsRead();

    // 降低轮询频率（建议至少 2~3 秒，避免服务器压力）
    setInterval(loadMessages, 3000); // 改为 3 秒一次
  </script>
</body>
</html>
